<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="./app.js"></script>
    <style>
        .mainBody{
            border: 1px solid black;
            padding: 50px;
            width: 300px;
            margin: 0 auto;
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        h1{
            color: red;
        }
        .btn{
            width: 90px;
            height: 40px;
            border-radius: 50px;
            border-style: solid;
            cursor: pointer;
            font-style: italic;
        }
        .btn:hover{
            background-color: red;
            color: white;
        }

    </style>
</head>
<body>
    
    <div class="mainBody">
            <h1>Basic calculator</h1>
            <label for="">number1</label>
            <input type="number" id="num1"><br><br>
            <label for="">number2</label>
            <input type="number" id="num2"><br><br>
            <label for="">choose any operation</label>
            <select name="" id="ope">
            <option value="choose">choose</option>
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            </select>
            <br><br>
            <button class="btn" onclick="compute()">submit</button>
            <button class="btn" onclick="clearAll()">clear</button>
            <h3>Answer: <span id="output"></span></h3>
    </div>
    
</body>
</html>
